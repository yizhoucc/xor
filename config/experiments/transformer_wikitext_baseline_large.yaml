# Transformer FFN GELU - large model (d=256)
exp_name: transformer_wikitext_baseline_large
task_type: language_model
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: StandardTransformer
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_layers: 6
  dropout: 0.1

lm:
  context_size: 64
  embed_dim: 256
  batch_size: 64
  epochs: 10
  lr: 0.0003
  grad_clip: 1.0
  num_seeds: 5
  num_workers: 4
