# MLP-Mixer + CIFAR-10 with InnerNet (no attention, pure MLP)
# Tests InnerNet in architecture WITHOUT multiplicative interactions
exp_name: mixer_cifar_2arg
task_type: mixer
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: InnerNetMLPMixer
  image_size: 32
  patch_size: 4
  in_channels: 3
  d_model: 128
  token_hidden: 64
  channel_hidden: 512
  num_layers: 4
  num_classes: 10
  inner_hidden: 32
  dropout: 0.1

mixer:
  batch_size: 128
  epochs: 50
  lr: 0.001
  num_seeds: 5
  num_workers: 4
