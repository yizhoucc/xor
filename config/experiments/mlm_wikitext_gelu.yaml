# Masked LM (BERT-style) + WikiText-2 + GELU baseline
exp_name: mlm_wikitext_gelu
task_type: mlm
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: StandardTransformer
  d_model: 128
  n_heads: 4
  d_ff: 512
  n_layers: 4
  dropout: 0.1

lm:
  context_size: 64
  batch_size: 128
  epochs: 10
  lr: 0.0005
  grad_clip: 1.0
  mask_prob: 0.15
  num_seeds: 5
  num_workers: 4
