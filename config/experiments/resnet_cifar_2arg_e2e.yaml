# End-to-end training ablation (no pretrain, no phase2 freeze)
---
exp_name: resnet_cifar_2arg_e2e
exp_dir: ./exp
use_gpu: true
gpus:
- 0
seed: 1234
dataset:
  name: cifar10
  loader_name: InnerNetData
  data_path: ./data
  split: train
model:
  name: InnerNetResNet
  num_classes: 10
  inner_hidden: 32
  loss: CrossEntropy
pretrain:
  optimizer: SGD
  num_workers: 0
  max_epoch: 500
  batch_size: 32
  snapshot_epoch: 1000
  lr: 0.001
  wd: 0.0
  momentum: 0.9
  shuffle: true
  best_model: []
train:
  optimizer: SGD
  lr_decay: 0.1
  lr_decay_steps:
  - 80
  - 120
  num_workers: 0
  max_epoch: 150
  batch_size: 32
  display_iter: 5000
  snapshot_epoch: 1000
  valid_epoch: 1
  lr: 0.01
  wd: 0.0005
  momentum: 0.9
  shuffle: true
  is_resume: false
  resume_model: None
  early_stop_window: 30
  best_model: /model_snapshot_best_phase1.pth
test:
  batch_size: 32
  num_workers: 0
  test_model: /model_snapshot_best_phase1.pth
training_mode: end_to_end
