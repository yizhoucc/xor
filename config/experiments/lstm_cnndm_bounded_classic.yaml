# LSTM + CNN/DailyMail with BoundedClassicInnerNetLSTMModel
exp_name: lstm_cnndm_bounded_classic
task_type: language_model
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: BoundedClassicInnerNetLSTMModel
  inner_hidden: 32

lm:
  dataset: cnn_dailymail
  context_size: 32
  embed_dim: 64
  hidden_dim: 128
  batch_size: 128
  epochs: 3
  lr: 0.001
  grad_clip: 1.0
  num_seeds: 5
  num_workers: 4
