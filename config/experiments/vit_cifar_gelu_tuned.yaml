# ViT GELU FFN - tuned (lower lr, more epochs)
exp_name: vit_cifar_gelu_tuned
task_type: mixer
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: StandardViT
  image_size: 32
  patch_size: 4
  in_channels: 3
  d_model: 128
  n_heads: 4
  d_ff: 512
  num_layers: 4
  num_classes: 10
  dropout: 0.1

mixer:
  batch_size: 128
  epochs: 100
  lr: 0.0003
  num_seeds: 5
  num_workers: 4
