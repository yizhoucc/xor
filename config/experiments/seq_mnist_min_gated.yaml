exp_name: seq_mnist_min_gated
exp_dir: ./exp
use_gpu: true
gpus: [0]
seed: 42
task_type: seq_mnist
data_path: ./data
model:
  name: SeqMinGatedRNN
seq_mnist:
  hidden_size: 128
  batch_size: 128
  epochs: 150
  lr: 1.0e-3
  grad_clip: 1.0
  num_seeds: 1        # one seed per job; fan out with --seed 42..51 for parallelism
  num_workers: 4
  inner_hidden: 32
  ortho_init: true
