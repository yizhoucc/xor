# ViT + CIFAR-10 with InnerNet FFN (tests FFN result on vision)
exp_name: vit_cifar_2arg
task_type: mixer
seed: 1234
use_gpu: true
exp_dir: exp

model:
  name: InnerNetViT
  image_size: 32
  patch_size: 4
  in_channels: 3
  d_model: 128
  n_heads: 4
  d_ff: 512
  num_layers: 4
  num_classes: 10
  inner_hidden: 32
  dropout: 0.1

mixer:
  batch_size: 128
  epochs: 50
  lr: 0.001
  num_seeds: 5
  num_workers: 4
