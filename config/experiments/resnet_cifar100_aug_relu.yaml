---
# ResNet-18 + CIFAR-100 + ReLU + data augmentation (standard recipe)
# Target: ~76-78% (standard baseline)
exp_name: resnet_cifar100_aug_relu
exp_dir: ./exp
use_gpu: true
gpus: [0]
seed: 1234
dataset:
  name: cifar100
  loader_name: InnerNetData
  data_path: ./data
  split: train
  augmentation: true
model:
  name: BaselineResNet
  num_classes: 100
  loss: CrossEntropy
pretrain:
  optimizer: SGD
  num_workers: 0
  max_epoch: 500
  batch_size: 128
  snapshot_epoch: 1000
  lr: 1.0e-3
  wd: 0.0e-4
  momentum: 0.9
  shuffle: true
  best_model: []
train:
  optimizer: SGD
  lr_decay: 0.1
  lr_decay_steps: [100, 150]
  num_workers: 0
  max_epoch: 200
  batch_size: 128
  display_iter: 5000
  snapshot_epoch: 1000
  valid_epoch: 1
  lr: 1.0e-1
  wd: 5.0e-4
  momentum: 0.9
  shuffle: true
  is_resume: false
  resume_model: None
  early_stop_window: 50
  best_model: /model_snapshot_best_phase1.pth
test:
  batch_size: 128
  num_workers: 0
  test_model: /model_snapshot_best_phase1.pth
